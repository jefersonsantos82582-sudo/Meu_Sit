<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora</title>
{% load static %}
<link rel="stylesheet" href="{% static 'calculadora/style.css' %}">
</head>

<body>

<div class="card">

<h1>🧮 Calculadora</h1>

<form method="POST" id="calc-form">
    {% csrf_token %}

    <input name="x" id="x" type="number" step="any" placeholder="Primeiro número">
    <input name="y" id="y" type="number" step="any" placeholder="Segundo número">

    <select name="op" id="op">
        <option>+</option>
        <option>-</option>
        <option>*</option>
        <option>/</option>
        <option>**</option>
    </select>

    <button type="submit">Calcular</button>
</form>

<div class="result" id="resultado">Resultado: {{ resultado }}</div>

<div class="historico" id="historico" hidden>
    <h2>Histórico</h2>
    <ul id="historico-lista"></ul>
</div>

</div>

<script src="{% static 'calculadora/app.js' %}" defer></script>

</body>
</html>
